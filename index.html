<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glowlogics Expense Tracker</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#182230}.wrap{max-width:900px;margin:40px auto;padding:20px}.card{background:white;border-radius:16px;padding:20px;box-shadow:0 8px 24px #0001;margin-bottom:20px}form{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px}input,select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #d9deea}button{background:#5146e5;color:white;border:0;cursor:pointer}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric{padding:16px;border-radius:12px;background:#f2f4ff}.metric strong{display:block;font-size:24px}.income{color:#16834b}.expense{color:#c33}.row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #edf0f5}.delete{background:white;color:#d33;border:1px solid #f0caca;padding:5px 8px}@media(max-width:650px){form{grid-template-columns:1fr}.summary{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>Glowlogics Expense Tracker</h1><p>Track income, expenses, and balance locally.</p><div class="card"><div class="summary"><div class="metric"><small>Income</small><strong id="income" class="income">$0.00</strong></div><div class="metric"><small>Expenses</small><strong id="expenses" class="expense">$0.00</strong></div><div class="metric"><small>Balance</small><strong id="balance">$0.00</strong></div></div></div><div class="card"><form onsubmit="add(event)"><input id="desc" placeholder="Description" required><input id="amount" type="number" step="0.01" min="0" placeholder="Amount" required><select id="type"><option value="expense">Expense</option><option value="income">Income</option></select><button>Add</button></form></div><div class="card"><h2>Transactions</h2><div id="list"></div></div></div><script>const key='glowlogics-expenses';let items=JSON.parse(localStorage.getItem(key)||'[]');function money(n){return '$'+n.toFixed(2)}function save(){localStorage.setItem(key,JSON.stringify(items))}function add(e){e.preventDefault();items.unshift({id:Date.now(),desc:desc.value,amount:Number(amount.value),type:type.value});desc.value='';amount.value='';save();render()}function removeItem(id){items=items.filter(x=>x.id!==id);save();render()}function render(){let inc=items.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),exp=items.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0);income.textContent=money(inc);expenses.textContent=money(exp);balance.textContent=money(inc-exp);list.innerHTML=items.map(x=>`<div class="row"><span>${x.desc}<br><small class="${x.type}">${x.type}</small></span><span>${x.type==='income'?'+':'-'}${money(x.amount)} <button class="delete" onclick="removeItem(${x.id})">×</button></span></div>`).join('')||'<p>No transactions yet.</p>'}render()</script></body></html>
